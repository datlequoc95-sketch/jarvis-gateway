<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S." />
  <title>J.A.R.V.I.S. MARK VII — Cổng Kết Nối Vĩnh Viễn</title>
  <style>
    :root {
      --cyan: #00f0ff;
      --green: #00ff9d;
      --amber: #ffaa00;
      --bg: #030811;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #071f38 0%, #030811 70%);
      color: #e4f9ff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .reactor {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.55), inset 0 0 25px rgba(0, 240, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      position: relative;
      animation: pulse 1.8s infinite ease-in-out;
    }
    .reactor::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px dashed var(--green);
      animation: spin 6s linear infinite;
    }
    .core {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, var(--cyan) 70%);
      box-shadow: 0 0 20px var(--cyan);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 21px;
      letter-spacing: 2px;
      color: var(--cyan);
      margin-bottom: 8px;
    }
    .status {
      font-size: 14px;
      color: #9ad8ec;
      max-width: 340px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .actions {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin-top: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 13px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      border: 1px solid var(--cyan);
      background: rgba(0, 240, 255, 0.14);
      color: #e4f9ff;
      cursor: pointer;
    }
    .btn.primary {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #01101f;
      border: none;
    }
    .btn.lan {
      border-color: var(--green);
      color: var(--green);
      background: rgba(0, 255, 157, 0.12);
    }
  </style>
</head>
<body>
  <div class="reactor"><div class="core"></div></div>
  <h1>J.A.R.V.I.S. MARK VII</h1>
  <div class="status" id="statusText">⚡ Đang định vị đường hầm bảo mật tới MacBook M3 Pro của Anh Đạt...</div>
  <div class="actions" id="fallbackActions">
    <a class="btn primary" id="btnTunnel" href="#">🌐 Kết nối qua Cloud Tunnel (4G / Wi-Fi)</a>
    <a class="btn lan" id="btnLan" href="#">📶 Kết nối trực tiếp Wi-Fi Nhà (LAN)</a>
    <button class="btn" onclick="location.reload()">🔄 Thử kết nối lại</button>
  </div>

  <script>
    const REPO = "datlequoc95-sketch/jarvis-gateway";
    const statusEl = document.getElementById("statusText");
    const actionsEl = document.getElementById("fallbackActions");

    function getParams() {
      const hash = window.location.hash.replace(/^#/, "");
      const hp = new URLSearchParams(hash);
      const qp = new URLSearchParams(window.location.search);
      let k = hp.get("k") || qp.get("k") || localStorage.getItem("jarvis_access_token") || "";
      let next = hp.get("next") || qp.get("next") || "/?source=ios_app";
      let mode = hp.get("mode") || qp.get("mode") || "";
      if (k) {
        try { localStorage.setItem("jarvis_access_token", k); } catch (e) {}
      }
      return { k: k.trim(), next, mode };
    }

    async function sha256Bytes(str) {
      const data = new TextEncoder().encode(str);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return new Uint8Array(buf);
    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function decryptEnvelope(env, token) {
      const macInput = `mac:${token}:${env.iv}:${env.cipher}`;
      const macHex = bytesToHex(await sha256Bytes(macInput));
      if (macHex !== env.mac) {
        throw new Error("Mã khóa bảo mật không khớp");
      }
      const binStr = atob(env.cipher);
      const cipherBytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) cipherBytes[i] = binStr.charCodeAt(i);

      const stream = new Uint8Array(cipherBytes.length);
      let offset = 0, blockIdx = 0;
      while (offset < cipherBytes.length) {
        const blk = await sha256Bytes(`${token}:${env.iv}:${blockIdx}`);
        const take = Math.min(blk.length, cipherBytes.length - offset);
        stream.set(blk.subarray(0, take), offset);
        offset += take;
        blockIdx++;
      }

      const plainBytes = new Uint8Array(cipherBytes.length);
      for (let i = 0; i < cipherBytes.length; i++) {
        plainBytes[i] = cipherBytes[i] ^ stream[i];
      }
      const jsonStr = new TextDecoder().decode(plainBytes);
      return JSON.parse(jsonStr);
    }

    async function fetchEncryptedEndpoint() {
      // Ưu tiên 1: GitHub REST API (0 giây cache, luôn mới nhất tức thì)
      try {
        const apiRes = await fetch(`https://api.github.com/repos/${REPO}/contents/endpoint.json?t=${Date.now()}`, {
          headers: { "Accept": "application/vnd.github.v3+json" },
          cache: "no-store"
        });
        if (apiRes.ok) {
          const meta = await apiRes.json();
          if (meta && meta.content) {
            const rawJson = atob(meta.content.replace(/\s/g, ""));
            return JSON.parse(rawJson);
          }
        }
      } catch (e) {}

      // Ưu tiên 2: File tĩnh cùng trang
      const staticRes = await fetch(`./endpoint.json?t=${Date.now()}`, { cache: "no-store" });
      if (!staticRes.ok) throw new Error("Không tải được endpoint.json");
      return await staticRes.json();
    }

    async function probeHttpsUrl(baseUrl, timeoutMs = 3200) {
      if (!baseUrl) return false;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        await fetch(`${baseUrl}/jarvis_icon.png?t=${Date.now()}`, {
          mode: "no-cors",
          cache: "no-store",
          signal: ctrl.signal
        });
        clearTimeout(timer);
        return true;
      } catch (e) {
        clearTimeout(timer);
        return false;
      }
    }

    async function boot() {
      const { k, next, mode } = getParams();
      if (!k) {
        statusEl.innerHTML = "🔒 Thiết bị chưa có khóa ghép nối.<br/>Anh Đạt hãy mở HUD trên MacBook → mục <b>📱 iPhone & Siri</b> để quét mã QR 1 lần duy nhất.";
        return;
      }

      try {
        const env = await fetchEncryptedEndpoint();
        const data = await decryptEnvelope(env, k);
        const targetPath = mode === "install" ? "/install" : next;

        const tunnelPairUrl = data.tunnel_url
          ? `${data.tunnel_url}/pair?k=${encodeURIComponent(k)}&next=${encodeURIComponent(targetPath)}`
          : "";
        const lanPairUrl = data.lan_url
          ? `${data.lan_url}/pair?k=${encodeURIComponent(k)}&next=${encodeURIComponent(targetPath)}`
          : "";

        if (tunnelPairUrl) document.getElementById("btnTunnel").href = tunnelPairUrl;
        if (lanPairUrl) document.getElementById("btnLan").href = lanPairUrl;

        // Thử kết nối Cloud Tunnel trước (hỗ trợ cả 4G và HTTPS microphone)
        if (data.tunnel_url) {
          statusEl.innerText = "🌐 Đang kết nối đường hầm Cloud HTTPS...";
          const tunnelOk = await probeHttpsUrl(data.tunnel_url, 3200);
          if (tunnelOk) {
            window.location.replace(tunnelPairUrl);
            return;
          }
        }

        // Nếu Cloud Tunnel bị nhà mạng chặn DNS tạm thời -> chuyển ngay sang LAN Wi-Fi
        if (lanPairUrl) {
          statusEl.innerText = "📶 Đang chuyển sang kết nối Wi-Fi nội bộ siêu tốc...";
          actionsEl.style.display = "flex";
          window.location.replace(lanPairUrl);
          return;
        }

        actionsEl.style.display = "flex";
      } catch (err) {
        statusEl.innerText = "⚠️ Không thể giải mã hoặc kết nối: " + (err.message || err);
        actionsEl.style.display = "flex";
      }
    }

    boot();
  </script>
</body>
</html>
